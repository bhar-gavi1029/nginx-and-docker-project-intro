worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Gzip Compression Settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 5;

    upstream nodejs_cluster {
        # --- Load Balancing Algorithms ---
        # 1. Round Robin: Default (uncomment both least_conn and ip_hash to use)
        # 2. Least Connections: least_conn;
        # 3. Sticky Sessions: ip_hash;
        
        least_conn;
        # ip_hash;

        server app:3000 max_fails=3 fail_timeout=10s;
    }

    # HTTP Server: Redirect all traffic to HTTPS on port 8443 (host port mapping)
    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        # SSL Protocols & Ciphers (Modern Hardening)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: http:;" always;

        # Try to serve static file from disk first, fallback to proxying to Node cluster
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ @nodejs;
            
            # Caching settings for static files served by Nginx
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # Fallback Proxy block
        location @nodejs {
            proxy_pass http://nodejs_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts to prevent 504 Gateway Timeout
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Automatically retry next server if current returns error/timeout
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
